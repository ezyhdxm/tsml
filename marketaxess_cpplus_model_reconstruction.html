<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MarketAxess CP+：反向工程建模报告</title>
<style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7fb;color:#172033}#status{max-width:760px;margin:12vh auto;padding:30px;background:#fff;border:1px solid #dfe5ee;border-radius:18px;box-shadow:0 8px 30px rgba(17,24,39,.08)}h1{font-size:26px;margin:0 0 10px}.muted{color:#647084}a{color:#3157d5}</style>
</head>
<body>
<div id="status"><h1>正在载入完整报告…</h1><p class="muted">报告内容保存在同一 GitHub 仓库的压缩 Git 对象中，浏览器将自动解压并呈现。</p></div>
<script>
(async()=>{
 const api='https://api.github.com/repos/ezyhdxm/tsml/git/blobs/b30343c430ec31066a92c768c9c6c2547b5eca0b';
 try{
  const r=await fetch(api,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json(); const s=j.content.replace(/\s/g,'');
  const raw=atob(s); const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
  const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(html); document.close();
 }catch(e){document.getElementById('status').innerHTML='<h1>报告载入失败</h1><p>'+String(e)+'</p><p>请使用对话中的 HTML 附件。</p>';}
})();
</script>
</body>
</html>
