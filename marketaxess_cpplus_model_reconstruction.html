<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarketAxess CP+：反向工程建模报告</title><style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7fb;color:#172033}#status{max-width:760px;margin:12vh auto;padding:30px;background:#fff;border:1px solid #dfe5ee;border-radius:18px;box-shadow:0 8px 30px rgba(17,24,39,.08)}h1{font-size:26px;margin:0 0 10px}.muted{color:#647084}</style></head><body><div id="status"><h1>正在载入 LaTeX 公式版报告…</h1><p class="muted">完整报告将从同一仓库载入；公式由 MathJax 排版。</p></div><script>
(async()=>{
 const api='https://api.github.com/repos/ezyhdxm/tsml/git/blobs/108ef4cb6f24ec449035550a6f5e9280e180fd5e';
 const cards=[{"label":"Side-specific supervised target with strict point-in-time features","tex":["\\begin{aligned}\ny_j\n&=\\operatorname{Level}\\!\\left(\\mathrm{qualifying\\ trade}_j\\right),\\\\\nx_j\n&=\\mathcal F\\!\\left(\\mathcal I_{t_j-\\delta}^{\\mathrm{available}},\n i_j,d_j,q_j\\right),\\\\\n\\widehat y_j\n&=(1-\\omega)x_j^{\\top}\\beta+\\omega G_{\\theta}(x_j),\\\\\n(\\widehat\\beta,\\widehat\\theta,\\widehat\\omega)\n&\\in\\arg\\min_{\\beta,\\theta,\\omega}\n\\sum_j w_j\\,\\rho_1\\!\\left(y_j-\\widehat y_j\\right),\n\\qquad \\rho_1(u)=|u|.\n\\end{aligned}"],"extra":"<div class=\"math-note\"><p><span class=\"math-inline\">δ<\/span> 是 publication/ingestion latency buffer；<span class=\"math-inline\">(i<sub>j<\/sub>, d<sub>j<\/sub>, q<sub>j<\/sub>)<\/span> 分别表示 bond、direction 与 size。Level 可以是 spread、OAS 或经过 duration/benchmark 标准化的价格水平。<\/p><\/div>"},{"label":"Mechanically generated high-dimensional feature cube","tex":["\\underbrace{6}_{\\text{data sources}}\n\\times\\underbrace{4}_{\\text{side relations}}\n\\times\\underbrace{5}_{\\text{lookback windows}}\n\\times\\underbrace{12}_{\\text{statistics}}\n=1{,}440\\ \\text{candidate features}."],"extra":"<div class=\"math-defs\">\n<div class=\"math-def\"><b>Sources<\/b>：platform RFQ、platform trades、TRACE D2C、TRACE D2D、dealer runs、composite/indicative<\/div>\n<div class=\"math-def\"><b>Relations<\/b>：same side、opposite side、D2D、all<\/div>\n<div class=\"math-def\"><b>Windows<\/b>：15s、1m、5m、30m、6h<\/div>\n<div class=\"math-def\"><b>Statistics<\/b>：last、age、count、EWMA、median、std、min/max、slope、size-weighted mean、total size、quality mean<\/div>\n<\/div>"},{"label":"Linear + boosted-tree ensemble","tex":["\\begin{aligned}\n\\widehat y_{j}^{\\mathrm{lin}}\n&=\\beta_0+\\sum_{k=1}^{p}\\beta_k x_{jk},\\\\\n\\widehat y_{j}^{\\mathrm{tree}}\n&=\\sum_{m=1}^{M}\\nu_m T_m(x_j),\\\\\n\\widehat y_j\n&=(1-\\omega_g)\\widehat y_{j}^{\\mathrm{lin}}\n +\\omega_g\\widehat y_{j}^{\\mathrm{tree}},\\\\\n\\widehat\\omega_g\n&\\in\\arg\\min_{\\omega\\in[0,1]}\n\\operatorname{MAE}_{\\mathrm{chronological\\ validation},g}(\\omega).\n\\end{aligned}"],"extra":"<div class=\"math-note\"><p><span class=\"math-inline\">g<\/span> 可以是 liquidity tier、IG/HY、side 或 confidence regime。线性部分稳定外推，tree 部分捕捉 side × size × recency × source 的非线性交互。<\/p><\/div>"},{"label":"Tiered extrapolation: different estimators for different evidence regimes","tex":["P_t(s_{\\mathrm{last}})\n=\\sum_{k=1}^{K}CF_k\\,DF_{\\mathrm{benchmark}}(t,T_k)\n\\exp\\!\\left(-s_{\\mathrm{last}}\\tau_k\\right).","\\widehat s_{\\mathrm{target},t}\n=s_{\\mathrm{equiv},t}\n+\\Delta_{\\mathrm{coupon}}+\\Delta_{\\mathrm{maturity}}\n+\\Delta_{\\mathrm{liquidity}}+\\Delta_{\\mathrm{legal}}\n+\\Delta_{\\mathrm{option}}.","\\widehat s_t\n=\\operatorname{wmed}_{d}\\!\\left(\n\\mathrm{level}_{d,t};\\\n e^{-\\mathrm{age}_{d,t}/h}\\,\n \\mathrm{firmness}_{d,t}\\,\n \\mathrm{quality}_{d,t}\n\\right)."],"extra":"<div class=\"math-note\"><p>Core、Core Extended、Equivalent Bond、Spread Adaptor、Indicative Composite、Comparable Bonds 是证据强度逐层下降的不同 route，不应仅作为“同一模型缺失值填补”。每个输出都应保留 tier、support、age 与置信度。<\/p><\/div>"},{"label":"Economic-package detection for matched-principal chains","tex":["\\operatorname{Package}(a,b)\n=\\mathbf 1\\!\\left\\{\n\\begin{array}{l}\ni_a=i_b,\\quad |t_a^{\\mathrm{exec}}-t_b^{\\mathrm{exec}}|\\le\\Delta_t,\\\\\n\\left|q_a/q_b-1\\right|\\le\\varepsilon_q,\\\\\n\\mathrm{type}(a)\\in\\mathrm{D2C},\\quad \\mathrm{type}(b)\\in\\mathrm{D2D},\\\\\n\\mathrm{prices\\ imply\\ nonnegative\\ intermediary\\ markup}\n\\end{array}\n\\right\\}."],"extra":"<ul class=\"math-list\">\n<li>将 2–4 条中间腿视为一个 economic package，而不是独立标签；<\/li>\n<li>client endpoint 可以作为 execution target；<\/li>\n<li>intermediate D2D legs 降权、作为 context，或直接排除；<\/li>\n<li>package markup 可训练独立的 intermediation-cost model。<\/li>\n<\/ul>"}];
 const css=".formula{font-family:inherit!important;background:linear-gradient(180deg,#fcfdff 0%,#f6f8fc 100%)!important;border:1px solid #d7dfec!important;border-radius:14px!important;padding:17px 18px!important;overflow-x:auto!important;margin:14px 0!important;color:#101828!important}.math-label{text-align:left;font-size:11px;font-weight:850;letter-spacing:.09em;text-transform:uppercase;color:#667085;margin:0 0 8px}.math-svg{min-width:max-content;padding:2px 5px;text-align:center}.math-svg+.math-svg{border-top:1px dashed #d8dee9;margin-top:14px;padding-top:17px}.math-note{border-top:1px solid #e4e7ec;margin-top:12px;padding-top:10px;text-align:left;color:#475467;font-size:13px}.math-defs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px;text-align:left}.math-def{background:#fff;border:1px solid #e4e7ec;border-radius:9px;padding:8px 10px;font-size:12px;color:#475467}.math-list{text-align:left;margin:10px 0 0;padding-left:22px;color:#475467;font-size:13px}@media(max-width:760px){.formula{padding:14px 11px!important}.math-defs{grid-template-columns:1fr}}";
 const mathjax=`<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']],processEscapes:true},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};<\/script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"><\/script>`;
 const render=c=>`<div class="formula math-card"><div class="math-label">${c.label}</div>${c.tex.map(t=>`<div class="math-svg">\\[${t}\\]</div>`).join('')}${c.extra}</div>`;
 try{
  const r=await fetch(api,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json(), s=j.content.replace(/\s/g,'');
  const inner=atob(s).replace(/\s/g,'');
  const raw=atob(inner), bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
  let report=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  let k=0; report=report.replace(/<div class="formula">[\s\S]*?<\/div>/g,()=>render(cards[k++]));
  if(k!==cards.length) throw new Error(`公式块数量不匹配: ${k}/${cards.length}`);
  report=report.replace('</style>',css+'</style>').replace('</head>',mathjax+'</head>');
  report=report.replace(/(<div class="meta">[\s\S]*?)(<\/div>)/, '$1<span class="pill">LaTeX · MathJax</span>$2');
  document.open(); document.write(report); document.close();
 }catch(e){document.getElementById('status').innerHTML='<h1>报告载入失败</h1><p>'+String(e)+'</p><p>请使用对话中的离线 HTML 附件。</p>';}
})();
</script></body></html>
