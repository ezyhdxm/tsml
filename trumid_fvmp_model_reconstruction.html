<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trumid FVMP：反向工程建模报告</title><style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7fb;color:#172033}#status{max-width:760px;margin:12vh auto;padding:30px;background:#fff;border:1px solid #dfe5ee;border-radius:18px;box-shadow:0 8px 30px rgba(17,24,39,.08)}h1{font-size:26px;margin:0 0 10px}.muted{color:#647084}</style></head><body><div id="status"><h1>正在载入 LaTeX 公式版报告…</h1><p class="muted">完整报告将从同一仓库载入；公式由 MathJax 排版。</p></div><script>
(async()=>{
 const api='https://api.github.com/repos/ezyhdxm/tsml/git/blobs/3837dc842165dd8bad45c14ba3e7f1eac3b9ca70';
 const cards=[{"label":"Hybrid active / curve / neighborhood mixture","tex":["\\begin{aligned}\nm_{i,t}^{a}\n&=f_{\\theta}\\!\\left(x_{i,t}^{\\mathrm{direct}},x_{i,t}^{\\mathrm{platform}},\n x_{i,t}^{\\mathrm{TRACE}},x_t^{\\mathrm{market}},z_i\\right),\\\\\nm_{i,t}^{c}\n&=g_{t}^{\\mathrm{peer}}(\\tau_i^{\\mathrm{eff}})\n +g_{i,t}^{\\mathrm{issuer}}(\\tau_i^{\\mathrm{eff}})\n +\\delta_i^{\\mathrm{struct}},\\\\\nm_{i,t}^{n}\n&=\\frac{\\sum_{j\\in\\mathcal N(i)}w_{ij,t}m_{j,t}}\n{\\sum_{j\\in\\mathcal N(i)}w_{ij,t}},\\\\\n(w_{i,t}^{a},w_{i,t}^{c},w_{i,t}^{n})\n&=\\operatorname{softmax}\\!\\left(g_{\\psi}(\\mathrm{activity},\\mathrm{age},\n\\mathrm{dispersion},\\mathrm{support},\\mathrm{outliers})\\right),\\\\\nm_{i,t}\n&=w_{i,t}^{a}m_{i,t}^{a}+w_{i,t}^{c}m_{i,t}^{c}+w_{i,t}^{n}m_{i,t}^{n},\\\\\np_{i,t}^{\\mathrm{exec}}\n&=m_{i,t}+\\operatorname{sgn}(\\mathrm{side})\\,\n c_{\\phi}(q,\\ell,\\nu,\\mathrm{protocol}).\n\\end{aligned}"],"extra":""},{"label":"Multi-task objective: mid, execution, interval and stability","tex":["\\mathcal L\n=\\mathcal L_{\\mathrm{mid}}(m_t,y_t^{\\mathrm{robust\\ mid}})\n+\\lambda_1\\mathcal L_{\\mathrm{exec}}\n\\!\\left(m_t+\\mathrm{side}_t\\,c_t,y_t^{\\mathrm{exec}}\\right)\n+\\lambda_2\\mathcal L_{\\mathrm{interval}}\n\\!\\left([b_t,a_t],y_{t:t+h}^{\\mathrm{trades}}\\right)\n+\\lambda_3\\Omega_{\\mathrm{temporal}}."],"extra":"<div class=\"math-note\"><p>这是一种合理的多任务重构：mid head 学习经济状态，cost head 学习 side/size concession，interval head 约束后续成交覆盖率，稳定性项抑制无信息时的非经济跳动。<\/p><\/div>"},{"label":"Peer curve, issuer residual curve and hierarchical shrinkage","tex":["\\begin{aligned}\ns_{i,t}\n={}&g_{q_i,g_i,r_i,t}(\\tau_i^{\\mathrm{eff}})\n+h_{\\mathrm{issuer}(i),t}(\\tau_i^{\\mathrm{eff}})\\\\\n&+\\delta_{\\mathrm{seniority}(i)}+\\delta_{\\mathrm{option}(i)}\n +\\delta_{\\mathrm{new\\ issue}(i)}+\\delta_{\\mathrm{liquidity}(i)}+\\varepsilon_{i,t}.\n\\end{aligned}","\\widehat\\beta\n\\in\\arg\\min_{\\beta}\n\\sum_i w_i\\left[s_i-B(\\tau_i)^{\\top}\\beta\\right]^2\n+\\lambda\\lVert D^2\\beta\\rVert_2^2,\n\\qquad\n\\widehat h_{e}(\\tau)\n=\\frac{n_e}{n_e+\\kappa}\\,h_{e}^{\\mathrm{raw}}(\\tau)."],"extra":"<div class=\"math-note\"><p>先拟合 quality × sector × rating peer curve，再对 issuer residual 做平滑和样本量收缩；这比逐 CUSIP 独立建模更适合 long tail。<\/p><\/div>"},{"label":"Bond-neighborhood inference","tex":["\\begin{aligned}\n\\widetilde w_{ij,t}\n&=\\exp\\!\\left(-\\frac{d(z_i,z_j)}{T}\\right)\n c_{j,t}^{\\mathrm{conf}}c_{j,t}^{\\mathrm{fresh}},\\\\\nw_{ij,t}\n&=\\frac{\\widetilde w_{ij,t}}{\\sum_{k\\in\\mathcal N(i)}\\widetilde w_{ik,t}},\\\\\nm_{i,t}^{n}\n&=\\sum_{j\\in\\mathcal N(i)}w_{ij,t}m_{j,t},\\\\\n(\\sigma_{i,t}^{n})^2\n&=\\sum_{j\\in\\mathcal N(i)}w_{ij,t}\n\\left(m_{j,t}-m_{i,t}^{n}\\right)^2.\n\\end{aligned}"],"extra":"<div class=\"math-note\"><p>距离 <span class=\"math-inline\">d(z<sub>i<\/sub>, z<sub>j<\/sub>)<\/span> 可在 duration、rating、sector、issuer、coupon、option、liquidity 和 learned embedding 上定义；confidence 与 freshness 防止 stale neighbor 主导估计。<\/p><\/div>"},{"label":"Reliability gating and confidence","tex":["\\begin{aligned}\na_{i,t}\n={}&a_0+a_1\\log(1+n_{i,t}^{\\mathrm{direct}})\n+a_2\\log(1+n_{i,t}^{\\mathrm{platform}})\\\\\n&-a_3\\,\\mathrm{age}_{i,t}-a_4\\,\\mathrm{dispersion}_{i,t}\n-a_5\\,\\mathrm{outlier\\ rate}_{i,t},\\\\\nw_{i,t}^{a}&=\\sigma(a_{i,t}),\\\\\nD_{i,t}\n&=\\sqrt{\\sum_{k\\in\\{a,c,n\\}}w_{i,t}^{k}\n\\left(m_{i,t}^{k}-m_{i,t}\\right)^2},\\\\\n\\mathrm{confidence}_{i,t}\n&=\\sigma\\!\\left(E_{i,t}-b_1D_{i,t}-b_2\\mathrm{age}_{i,t}\n-b_3\\mathrm{outlier\\ rate}_{i,t}\\right).\n\\end{aligned}"],"extra":"<div class=\"math-note\"><p>当 active route 缺少直接证据时，剩余权重可在 curve 与 neighborhood 之间按 issuer support、peer support 和 residual dispersion 再归一化。<\/p><\/div>"},{"label":"Grouped split-conformal uncertainty","tex":["r_g\n=\\operatorname{Quantile}_{1-\\alpha}\n\\left(\\left\\{|y_j-\\widehat y_j|:j\\in\\mathcal C_g\\right\\}\\right),\n\\qquad\n\\mathcal I_{i,t}^{1-\\alpha}\n=\\left[m_{i,t}-r_{g(i,t)},\\ m_{i,t}+r_{g(i,t)}\\right]."],"extra":"<div class=\"math-note\"><p>Calibration group <span class=\"math-inline\">g<\/span> 最好至少区分 route、confidence bucket、IG/HY、liquidity 与 volatility regime，并按时间滚动更新。<\/p><\/div>"},{"label":"Six-bucket side- and size-adjusted execution surface","tex":["\\begin{aligned}\np_{i,t}^{\\mathrm{client\\ buy}}(q)\n&=m_{i,t}-c_{\\mathrm{buy}}(q,\\ell,\\nu,\\mathrm{protocol},q_i),\\\\\np_{i,t}^{\\mathrm{client\\ sell}}(q)\n&=m_{i,t}+c_{\\mathrm{sell}}(q,\\ell,\\nu,\\mathrm{protocol},q_i),\\\\\nq&\\in\\{100\\mathrm K,250\\mathrm K,500\\mathrm K,1\\mathrm{MM},2\\mathrm{MM},5\\mathrm{MM}+\\}.\n\\end{aligned}"],"extra":"<div class=\"math-note\"><p>成本曲线不应机械强制全局单调：常规区间可能因规模经济而下降，超大 block 又可能因 capacity 与 market impact 上升。<\/p><\/div>"}];
 const css=".formula{font-family:inherit!important;background:linear-gradient(180deg,#fcfdff 0%,#f6f8fc 100%)!important;border:1px solid #d7dfec!important;border-radius:14px!important;padding:17px 18px!important;overflow-x:auto!important;margin:14px 0!important;color:#101828!important}.math-label{text-align:left;font-size:11px;font-weight:850;letter-spacing:.09em;text-transform:uppercase;color:#667085;margin:0 0 8px}.math-svg{min-width:max-content;padding:2px 5px;text-align:center}.math-svg+.math-svg{border-top:1px dashed #d8dee9;margin-top:14px;padding-top:17px}.math-note{border-top:1px solid #e4e7ec;margin-top:12px;padding-top:10px;text-align:left;color:#475467;font-size:13px}.math-defs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px;text-align:left}.math-def{background:#fff;border:1px solid #e4e7ec;border-radius:9px;padding:8px 10px;font-size:12px;color:#475467}.math-list{text-align:left;margin:10px 0 0;padding-left:22px;color:#475467;font-size:13px}@media(max-width:760px){.formula{padding:14px 11px!important}.math-defs{grid-template-columns:1fr}}";
 const mathjax=`<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']],processEscapes:true},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};<\/script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"><\/script>`;
 const render=c=>`<div class="formula math-card"><div class="math-label">${c.label}</div>${c.tex.map(t=>`<div class="math-svg">\\[${t}\\]</div>`).join('')}${c.extra}</div>`;
 try{
  const r=await fetch(api,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json(), s=j.content.replace(/\s/g,'');
  const raw=atob(s), bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
  let report=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  let k=0; report=report.replace(/<div class="formula">[\s\S]*?<\/div>/g,()=>render(cards[k++]));
  if(k!==cards.length) throw new Error(`公式块数量不匹配: ${k}/${cards.length}`);
  report=report.replace('</style>',css+'</style>').replace('</head>',mathjax+'</head>');
  report=report.replace(/(<div class="meta">[\s\S]*?)(<\/div>)/, '$1<span class="pill">LaTeX · MathJax</span>$2');
  document.open(); document.write(report); document.close();
 }catch(e){document.getElementById('status').innerHTML='<h1>报告载入失败</h1><p>'+String(e)+'</p><p>请使用对话中的离线 HTML 附件。</p>';}
})();
</script></body></html>
