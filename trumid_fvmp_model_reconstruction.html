<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trumid FVMP：反向工程建模报告</title><style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7fb;color:#172033}#status{max-width:760px;margin:12vh auto;padding:30px;background:#fff;border:1px solid #dfe5ee;border-radius:18px;box-shadow:0 8px 30px rgba(17,24,39,.08)}h1{font-size:26px;margin:0 0 10px}.muted{color:#647084}</style></head><body><div id="status"><h1>正在载入 LaTeX 公式版报告…</h1><p class="muted">完整报告由同一仓库内的 HTML payload 载入；公式由 MathJax 排版。</p></div><script>
(async()=>{
 const urls=[
  'https://raw.githubusercontent.com/ezyhdxm/tsml/main/report_payloads/trumid_fvmp_payload_1.html',
  'https://raw.githubusercontent.com/ezyhdxm/tsml/main/report_payloads/trumid_fvmp_payload_2.html'
 ];
 try{
  const parts=await Promise.all(urls.map(async u=>{
   const r=await fetch(u,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
   const t=await r.text(); const m=t.match(/<template id="payload">([\s\S]*?)<\/template>/);
   if(!m) throw new Error('payload missing'); return m[1].replace(/\s/g,'');
  }));
  const raw=atob(parts.join(''));
  const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
  const report=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  document.open(); document.write(report); document.close();
 }catch(e){document.getElementById('status').innerHTML='<h1>报告载入失败</h1><p>'+String(e)+'</p><p>请使用对话中的离线 HTML 附件。</p>';}
})();
</script></body></html>
