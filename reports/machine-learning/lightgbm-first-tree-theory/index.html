<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>第一棵 LightGBM 树的统计理论</title>
<style>
body{margin:0;background:#f5f7fa;color:#182230;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
#status{max-width:760px;margin:12vh auto;padding:30px;border:1px solid #d9e0e8;border-radius:18px;background:#fff;box-shadow:0 10px 30px rgba(24,34,48,.08)}
h1{margin:0 0 10px;font-size:28px}p{line-height:1.7;color:#5e6b7a}code{background:#eef1f5;padding:2px 5px;border-radius:4px}
</style>
</head>
<body>
<div id="status"><h1>正在载入完整报告…</h1><p>这是由 Markdown manuscript 渲染的 HTML；公式使用浏览器原生 MathML。</p></div>
<script src="payloads/report_part_1.js"></script>
<script src="payloads/report_part_2.js"></script>
<script src="payloads/report_part_3.js"></script>
<script src="payloads/report_part_4.js"></script>
<script>
(async()=>{
  try{
    const bytes=Uint8Array.from(atob(window.__TSML_REPORT_B64||''),c=>c.charCodeAt(0));
    const html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('status').innerHTML='<h1>报告载入失败</h1><p>'+String(e)+'</p><p>请确保 <code>payloads/</code> 与本文件保持在同一目录，或使用 Markdown 源文件重新渲染。</p>';
  }
})();
</script>
</body>
</html>
