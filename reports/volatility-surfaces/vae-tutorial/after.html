
<script>
(function(){
 const root=document.documentElement, btn=document.getElementById('theme-toggle');
 let saved=null; try{saved=localStorage.getItem('volvae-theme')}catch(_e){} if(saved) root.dataset.theme=saved;
 btn.addEventListener('click',()=>{const next=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=next;try{localStorage.setItem('volvae-theme',next)}catch(_e){}});
 const progress=document.getElementById('progress');
 addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;progress.style.width=(h?100*scrollY/h:0)+'%';},{passive:true});
 document.querySelectorAll('pre').forEach(pre=>{const b=document.createElement('button');b.className='copy-btn';b.textContent='复制';b.onclick=async()=>{await navigator.clipboard.writeText(pre.innerText.replace(/^复制/,''));b.textContent='已复制';setTimeout(()=>b.textContent='复制',1200)};pre.appendChild(b)});
 document.querySelectorAll('a[href^="http"]').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});
 const search=document.getElementById('lit-search'), table=document.getElementById('literature-matrix');
 if(search&&table){search.addEventListener('input',()=>{const q=search.value.trim().toLowerCase();table.querySelectorAll('tbody tr').forEach(tr=>tr.hidden=q&&!tr.textContent.toLowerCase().includes(q));});}
 const tocLinks=[...document.querySelectorAll('#TOC a')]; const map=new Map(tocLinks.map(a=>[decodeURIComponent(a.hash.slice(1)),a]));
 const obs=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){tocLinks.forEach(a=>a.classList.remove('active'));const a=map.get(e.target.id);if(a)a.classList.add('active')}})},{rootMargin:'-10% 0px -75% 0px'});
 document.querySelectorAll('main h1[id],main h2[id],main h3[id]').forEach(h=>obs.observe(h));
})();
</script>
