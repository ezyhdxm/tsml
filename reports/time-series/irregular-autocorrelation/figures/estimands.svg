<svg xmlns="http://www.w3.org/2000/svg" width="800" height="325" viewBox="0 0 800 325" role="img">
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif;fill:#17212d}
.small{font-size:14px;fill:#5d6b79} .label{font-size:16px;font-weight:600} .title{font-size:20px;font-weight:700}
.axis{stroke:#7b8794;stroke-width:1.2} .grid{stroke:#e3e8ee;stroke-width:1} .point{fill:#2447a8}
</style>

<text x="40" y="38" class="title">Event-time lag 与 clock-time lag</text>
<line x1="65" y1="165" x2="755" y2="165" class="axis"/>
<circle cx="85" cy="165" r="6" class="point"/><circle cx="150" cy="165" r="6" class="point"/><circle cx="270" cy="165" r="6" class="point"/><circle cx="315" cy="165" r="6" class="point"/><circle cx="505" cy="165" r="6" class="point"/><circle cx="660" cy="165" r="6" class="point"/><circle cx="725" cy="165" r="6" class="point"/><text x="85" y="192" text-anchor="middle" class="small">t1</text><text x="150" y="192" text-anchor="middle" class="small">t2</text><text x="270" y="192" text-anchor="middle" class="small">t3</text><text x="315" y="192" text-anchor="middle" class="small">t4</text><text x="505" y="192" text-anchor="middle" class="small">t5</text><text x="660" y="192" text-anchor="middle" class="small">t6</text><text x="725" y="192" text-anchor="middle" class="small">t7</text>
<path d="M150 125 Q210 88 270 125" fill="none" stroke="#287a50" stroke-width="3"/>
<path d="M270 125 Q292 104 315 125" fill="none" stroke="#287a50" stroke-width="3"/>
<text x="232" y="78" text-anchor="middle" class="label" fill="#287a50">event lag = 2 observations</text>
<line x1="315" y1="225" x2="505" y2="225" stroke="#a96700" stroke-width="3"/>
<path d="M315 218 L315 232 M505 218 L505 232" stroke="#a96700" stroke-width="3"/>
<text x="410" y="255" text-anchor="middle" class="label" fill="#a96700">clock lag = t₅ − t₄</text>
<text x="40" y="298" class="small">相同的 event lag 可以对应完全不同的真实时间；固定 clock lag 则可能没有恰好匹配的 observation。</text>

</svg>