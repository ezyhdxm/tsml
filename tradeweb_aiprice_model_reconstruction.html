<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tradeweb Ai-Price：反向工程建模报告</title><style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:#f6f7fb;color:#172033}#status{max-width:760px;margin:12vh auto;padding:30px;background:#fff;border:1px solid #dfe5ee;border-radius:18px;box-shadow:0 8px 30px rgba(17,24,39,.08)}h1{font-size:26px;margin:0 0 10px}.muted{color:#647084}</style></head><body><div id="status"><h1>正在载入 LaTeX 公式版报告…</h1><p class="muted">完整报告将从同一仓库载入；公式由 MathJax 排版。</p></div><script>
(async()=>{
 const api='https://api.github.com/repos/ezyhdxm/tsml/git/blobs/bc4d98a1aeb5c4eab3b51401b3c92482ece11807';
 const cards=[{"label":"Latent spread state and irregular-time dynamics","tex":["\\begin{aligned}\ns_{i,t}\n&=h_i\\!\\left(\\tau_i^{\\mathrm{eff}},q_i,g_i,r_i,o_i\\right)^{\\!\\top}f_t+u_{i,t},\\\\\nf_t\n&=\\Phi(\\Delta t)f_{t-1}+\\Gamma\\,\\Delta m_t+\\eta_t,\n&\\eta_t&\\sim\\mathcal N(0,Q_t),\\\\\nu_{i,t}\n&=\\rho_i(\\Delta t)u_{i,t-1}+\\xi_{i,t},\n&\\xi_{i,t}&\\sim\\mathcal N(0,q_{i,t}).\n\\end{aligned}"],"extra":"<div class=\"math-defs\">\n<div class=\"math-def\"><b><span class=\"math-inline\">s<sub>i,t<\/sub><\/span><\/b>：latent mid spread / OAS<\/div>\n<div class=\"math-def\"><b><span class=\"math-inline\">f<sub>t<\/sub><\/span><\/b>：global、IG/HY、sector、rating 与 curve factors<\/div>\n<div class=\"math-def\"><b><span class=\"math-inline\">u<sub>i,t<\/sub><\/span><\/b>：bond-specific residual<\/div>\n<div class=\"math-def\"><b><span class=\"math-inline\">Δm<sub>t<\/sub><\/span><\/b>：Treasury、swap、CDX 与 broad-market shocks<\/div>\n<\/div>"},{"label":"Observation equations: side, size and D2D uncertainty","tex":["\\begin{aligned}\nz_{i,t}^{\\mathrm{client\\ buy}}\n&=s_{i,t}-c_i(q,\\ell,\\nu,v)+\\varepsilon_{i,t}^{\\mathrm{buy}},\\\\\nz_{i,t}^{\\mathrm{client\\ sell}}\n&=s_{i,t}+c_i(q,\\ell,\\nu,v)+\\varepsilon_{i,t}^{\\mathrm{sell}},\\\\\nz_{i,t}^{\\mathrm{bid/ask}}\n&=s_{i,t}\\mp a_{i,t}+\\varepsilon_{i,t}^{q},\\\\\nz_{i,t}^{\\mathrm{D2D}}\n&\\in\\bigl[s_{i,t}-a_{i,t},\\ s_{i,t}+a_{i,t}\\bigr]+\\varepsilon_{i,t}^{\\mathrm{D2D}}.\n\\end{aligned}"],"extra":"<div class=\"math-note\"><p>这里采用 yield/spread 记号，因此 client buy 的 spread 通常低于 mid；若用 clean price 建模，方向应反转。D2D 更适合作为高噪声或区间观测，而不是强制等于 mid。<\/p><\/div>"},{"label":"Process covariance, posterior bond covariance and dynamic beta","tex":["\\begin{aligned}\nS_t\n&=\\lambda S_{t-1}+(1-\\lambda)e_t e_t^{\\top},\\\\\nQ_t\n&=(1-\\alpha)S_t+\\alpha\\mu_t I,\\\\\n\\operatorname{Cov}\\!\\left(s_{i,t},s_{j,t}\\mid\\mathcal I_t\\right)\n&=h_i^{\\top}P_t h_j+\\mathbf 1_{\\{i=j\\}}v_{i,t}.\n\\end{aligned}","\\begin{aligned}\nK_{i,t}^{\\beta}\n&=\\frac{P_{i,t-1}^{\\beta}x_t}\n{\\lambda_{\\beta}+x_t^{\\top}P_{i,t-1}^{\\beta}x_t},\\\\\n\\beta_{i,t}^{\\mathrm{raw}}\n&=\\beta_{i,t-1}+K_{i,t}^{\\beta}\n\\left(\\Delta s_{i,t}-x_t^{\\top}\\beta_{i,t-1}\\right),\\\\\n\\beta_{i,t}\n&=\\omega_{i,t}\\beta_{i,t}^{\\mathrm{raw}}\n +(1-\\omega_{i,t})\\bar\\beta_{g(i),t}.\n\\end{aligned}"],"extra":"<div class=\"math-note\"><p><b>来源解释：<\/b><span class=\"math-inline\">Q<sub>t<\/sub><\/span> 来自去噪 factor innovations 的 EWMA covariance 再做 shrinkage；<span class=\"math-inline\">P<sub>t<\/sub><\/span> 是滤波后的 posterior covariance；最后一项把样本少的单券 beta 收缩到 peer-group beta。<\/p><\/div>"},{"label":"Continuous term structure with effective tenor","tex":["\\begin{aligned}\nB_0(\\tau)&=1,\\\\\nB_1(\\tau;\\lambda)&=\\frac{1-e^{-\\lambda\\tau}}{\\lambda\\tau},\\\\\nB_2(\\tau;\\lambda)&=B_1(\\tau;\\lambda)-e^{-\\lambda\\tau}.\n\\end{aligned}","\\begin{aligned}\ns_{i,t}\n={}&B(\\tau_i^{\\mathrm{eff}})^{\\top}\\theta_{\\mathrm{global},t}\n +\\mathbf 1_{\\{i\\in\\mathrm{HY}\\}}B(\\tau_i^{\\mathrm{eff}})^{\\top}\\theta_{\\mathrm{HY},t}\\\\\n&+\\gamma_{\\mathrm{sector}(i),t}\n +\\gamma_{\\mathrm{rating}(i),t}\n +h_{\\mathrm{issuer}(i),t}(\\tau_i^{\\mathrm{eff}})\n +u_{i,t}.\n\\end{aligned}"],"extra":"<div class=\"math-note\"><p>Callable bond 的横轴应优先使用 option-adjusted effective tenor / duration，而不是机械地使用 legal maturity；短端则需要单独的 discount-spread 或 short-end basis。<\/p><\/div>"},{"label":"Sequential Bayesian update","tex":["\\begin{aligned}\n\\mu_t^{-}&=\\Phi_t\\mu_{t-1},\n&P_t^{-}&=\\Phi_tP_{t-1}\\Phi_t^{\\top}+Q_t,\\\\\n\\nu_t&=z_t-h_t^{\\top}\\mu_t^{-},\n&S_t^{z}&=h_t^{\\top}P_t^{-}h_t+R_t,\\\\\nK_t&=\\frac{P_t^{-}h_t}{S_t^{z}},\n&\\mu_t&=\\mu_t^{-}+K_t\\nu_t,\\\\\nP_t&=P_t^{-}-\\frac{P_t^{-}h_t h_t^{\\top}P_t^{-}}{S_t^{z}}.\n\\end{aligned}","\\widehat s_{i,t}\\ \\pm\\ z_{1-\\alpha/2}\n\\sqrt{h_i^{\\top}P_t h_i+v_{i,t}},\n\\qquad\n\\widetilde z_t=\\Pi_{[L_t,U_t]}\\!\\left(h_t^{\\top}\\mu_t^{-}\\right)."],"extra":"<div class=\"math-note\"><p>对区间观测 <span class=\"math-inline\">[L<sub>t<\/sub>, U<sub>t<\/sub>]<\/span>，若预测已在区间内则几乎不产生方向更新；若在区间外，可先投影到最近边界并放大 <span class=\"math-inline\">R<sub>t<\/sub><\/span>。更精确的实现使用 truncated-normal likelihood 或 particle filter。<\/p><\/div>"}];
 const css=".formula{font-family:inherit!important;background:linear-gradient(180deg,#fcfdff 0%,#f6f8fc 100%)!important;border:1px solid #d7dfec!important;border-radius:14px!important;padding:17px 18px!important;overflow-x:auto!important;margin:14px 0!important;color:#101828!important}.math-label{text-align:left;font-size:11px;font-weight:850;letter-spacing:.09em;text-transform:uppercase;color:#667085;margin:0 0 8px}.math-svg{min-width:max-content;padding:2px 5px;text-align:center}.math-svg+.math-svg{border-top:1px dashed #d8dee9;margin-top:14px;padding-top:17px}.math-note{border-top:1px solid #e4e7ec;margin-top:12px;padding-top:10px;text-align:left;color:#475467;font-size:13px}.math-defs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px;text-align:left}.math-def{background:#fff;border:1px solid #e4e7ec;border-radius:9px;padding:8px 10px;font-size:12px;color:#475467}.math-list{text-align:left;margin:10px 0 0;padding-left:22px;color:#475467;font-size:13px}@media(max-width:760px){.formula{padding:14px 11px!important}.math-defs{grid-template-columns:1fr}}";
 const mathjax=`<script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']],processEscapes:true},options:{skipHtmlTags:['script','noscript','style','textarea','pre','code']}};<\/script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"><\/script>`;
 const render=c=>`<div class="formula math-card"><div class="math-label">${c.label}</div>${c.tex.map(t=>`<div class="math-svg">\\[${t}\\]</div>`).join('')}${c.extra}</div>`;
 try{
  const r=await fetch(api,{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json(), s=j.content.replace(/\s/g,'');
  const raw=atob(s), bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
  let report=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  let k=0; report=report.replace(/<div class="formula">[\s\S]*?<\/div>/g,()=>render(cards[k++]));
  if(k!==cards.length) throw new Error(`公式块数量不匹配: ${k}/${cards.length}`);
  report=report.replace('</style>',css+'</style>').replace('</head>',mathjax+'</head>');
  report=report.replace(/(<div class="meta">[\s\S]*?)(<\/div>)/, '$1<span class="pill">LaTeX · MathJax</span>$2');
  document.open(); document.write(report); document.close();
 }catch(e){document.getElementById('status').innerHTML='<h1>报告载入失败</h1><p>'+String(e)+'</p><p>请使用对话中的离线 HTML 附件。</p>';}
})();
</script></body></html>
